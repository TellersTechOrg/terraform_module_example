name: Terraform CI

on: 
  pull_request:
    branches:
      - master

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest became Ubuntu 26.04 on 2026-10-19 (see the PR that added this line)
    steps:
    - uses: actions/checkout@v2
    - uses: hashicorp/setup-terraform@v1
      with:
        terraform_version: 0.13.4

    - name: Terraform fmt
      id: fmt
      run: terraform fmt

    - name: Terraform init
      id: init
      run: terraform init

    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color
